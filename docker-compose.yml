version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://192.168.1.49:8080
      - VITE_WS_URL=ws://192.168.1.49:8080
    stdin_open: true
    tty: true
